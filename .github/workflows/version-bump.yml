name: Version Bump

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and the head branch lives in the fork —
    # skip instead of failing on push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version
        run: |
          # Skip if this is itself a version-bump commit (prevent re-trigger loop)
          LAST_MSG=$(git log -1 --format=%s)
          if [[ "$LAST_MSG" == chore\(release\):* ]]; then
            echo "Version bump commit — skipping"
            exit 0
          fi

          # Use the latest tag on main as the base, regardless of when this
          # branch was cut relative to the last release. tag-on-merge.yml
          # creates that tag from package.json once a PR lands on main, so the
          # base here always reflects the last released version.
          LAST_TAG=$(git tag --merged origin/main --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No tags found on main — skipping"
            exit 0
          fi

          # Determine bump type from commit subjects and bodies since that tag
          SUBJECTS=$(git log "${LAST_TAG}..HEAD" --format="%s")
          BODIES=$(git log "${LAST_TAG}..HEAD" --format="%b")

          BUMP=""
          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
             echo "$BODIES"   | grep -q "BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          elif echo "$SUBJECTS" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No releasable commits since $LAST_TAG — skipping"
            exit 0
          fi

          # Compute next version from the last main tag (not package.json)
          BASE=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) NEXT="$((MAJOR+1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR+1)).0" ;;
            *)     NEXT="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac

          echo "Base: $LAST_TAG  |  Bump: $BUMP  |  Next: $NEXT"

          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$NEXT" ]; then
            echo "package.json already at $NEXT — nothing to do"
            exit 0
          fi

          npm version "$NEXT" --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          # No [skip ci]: the bump commit becomes the PR head SHA, so it must get
          # a CI run or required status checks will stall (or merge untested).
          # The chore(release): last-commit guard above breaks the re-trigger loop.
          git commit -m "chore(release): bump version to $NEXT"
          # The docs workflow may push to this branch concurrently — rebase onto
          # the remote before pushing to avoid a non-fast-forward reject.
          git pull --rebase origin "$GITHUB_HEAD_REF"
          git push
