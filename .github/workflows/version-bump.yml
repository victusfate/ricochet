name: Version Bump

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          # Avoid re-running on our own version-bump commit
          LAST_MSG=$(git log -1 --format=%s)
          if [[ "$LAST_MSG" == chore\(release\):* ]]; then
            echo "Version bump commit — skipping"
            exit 0
          fi

          # Determine bump type from conventional commits since the last tag
          BUMP=$(npx --yes conventional-recommended-bump -p conventionalcommits 2>/dev/null)
          if [ -z "$BUMP" ]; then
            echo "No releasable commits found — skipping"
            exit 0
          fi

          # Calculate next version using pure bash arithmetic (no extra deps)
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEXT="$((MAJOR+1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR+1)).0" ;;
            *)     NEXT="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac

          echo "Bump: $BUMP  |  $CURRENT → $NEXT"

          if [ "$CURRENT" = "$NEXT" ]; then
            echo "Version already at $NEXT — nothing to do"
            exit 0
          fi

          npm version "$NEXT" --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(release): bump version to $NEXT [skip ci]"
          git push
