name: Docs

# Verifies docs/api is current — it never commits or pushes. Bot pushes are a
# dead end here: on a PR branch the bot commit becomes the PR head, and
# GITHUB_TOKEN pushes never trigger workflows, so the required verify check
# can never report; on main, branch protection rejects the direct push (GH013).
# TypeDoc output is deterministic (sourceLinkTemplate pins links to main), so
# regenerating and diffing is a reliable staleness check.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'typedoc.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Markdown docs
        run: npm run docs:api

      - name: Fail if docs are stale
        run: |
          # -N registers untracked generated files so they show up in the diff
          git add -N docs/api
          if ! git diff --exit-code docs/api; then
            echo ""
            echo "::error::docs/api is stale — run 'npm run docs:api' locally and commit the result."
            exit 1
          fi
