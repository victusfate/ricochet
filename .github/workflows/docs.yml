name: Update API docs

# Runs on main only. On PRs the bot's push becomes the PR head, and pushes made
# with GITHUB_TOKEN never trigger workflows — so a required CI check on that
# head can never report, permanently blocking the merge. Regenerating after
# merge avoids the whole class of bot-push races.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'typedoc.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Markdown docs
        run: npm run docs:api

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git diff --cached --quiet || git commit -m "docs(api): regenerate TypeDoc Markdown"
          # Another workflow may push to main concurrently — rebase before
          # pushing to avoid a non-fast-forward reject.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
